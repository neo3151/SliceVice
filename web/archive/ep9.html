  <style>
    body {
      margin: 0;
      padding: 0;
      background: #050505;
      color: #00ffff;
      font-family: 'VT323', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {

      padding: 20px;
      background: #111;

      display: flex;
      flex-direction: column;
      gap: 60px;
    }
    .panel-wrapper {
      position: relative;
      border: 4px solid #1a1a1a;
      transition: border-color 0.3s;
    }
    .panel-wrapper:hover {
      border-color: #00ffff;
    }
    .panel-wrapper img {
      width: 100%;
      display: block;
      filter: contrast(1.1) brightness(1.1);
    }
    .panel-label {
      position: absolute;
      bottom: -30px;
      right: 0;
      font-size: 1.2rem;
      color: #666;
    }
    .footer {
      padding: 60px;
      color: #333;
      font-size: 1rem;
    }
    /* CRT Scanline Effect */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));

      background-size: 100% 4px, 3px 100%;
